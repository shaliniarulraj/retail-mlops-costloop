name: retail-mlops-ci-cd

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -v

  data_and_features:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Generate synthetic data (CI environment - no DVC remote)
        run: python src/data/generate_synthetic_data.py

      - name: Validate schema
        run: python src/data/validate.py

      - name: Build features
        run: python src/features/build_features.py

      - name: Fold in any pending manager overrides
        run: python src/feedback/fold_into_training.py

      - uses: actions/upload-artifact@v4
        with:
          name: features
          path: data/processed/features.parquet

  cost_based_retrain_check:
    needs: data_and_features
    runs-on: ubuntu-latest
    outputs:
      should_retrain: ${{ steps.check.outputs.should_retrain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: features
          path: data/processed/

      - name: Generate synthetic data for trigger check
        run: python src/data/generate_synthetic_data.py

      - name: Run cost-based retrain trigger
        id: check
        run: |
          python src/pipeline/retrain_trigger.py && echo "should_retrain=false" >> "$GITHUB_OUTPUT" || echo "should_retrain=true" >> "$GITHUB_OUTPUT"
        continue-on-error: true

  retrain_and_promote:
    needs: cost_based_retrain_check
    if: needs.cost_based_retrain_check.outputs.should_retrain == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: features
          path: data/processed/

      - name: Retrain model
        run: python src/training/train.py

      - name: Promote model if it beats production on cost
        run: python src/pipeline/promote_if_better.py

  build_and_push_image:
    needs: retrain_and_promote
    if: always() && (needs.retrain_and_promote.result == 'success' || needs.retrain_and_promote.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Generate data and train model for Docker build
        run: |
          python src/data/generate_synthetic_data.py
          python src/features/build_features.py
          python src/training/train.py

      - name: Build Docker image
        run: docker build -f deployment/Dockerfile -t retail-forecast-api:${{ github.sha }} .